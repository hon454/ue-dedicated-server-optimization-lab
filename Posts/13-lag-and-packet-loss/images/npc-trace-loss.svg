<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="손실만. 이동 갱신 하나를 잃은 곳에서 클라이언트 화면의 NPC가 약 118ms 멈춘 뒤 밀린 거리를 한 프레임에 건너뛴다.">
