<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="지연만. 클라이언트 화면의 NPC는 이동 갱신을 받기 직전 프레임에 멈추고 받은 프레임에 두 걸음을 간다. 서버보다 약 286ms 늦다.">
<style>
