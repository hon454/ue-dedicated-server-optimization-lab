<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="루프백. 클라이언트 화면의 NPC는 서버의 NPC와 같은 기울기로 매끄럽게 움직이고 약 155ms 늦다.">
