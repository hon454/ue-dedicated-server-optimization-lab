<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="NPC 갱신 한 번에 이동으로 가는 비트. 지금은 ReplicatedMovement 83비트와 ServerFrame 16비트로 99비트이고 그중 Z, 속도, 위치 헤더, 늘 같은 플래그가 필요 없다. FLabNpcMove는 집 기준 X, Y 13비트씩, Yaw, 프레임 번호와 핸들로 50비트다.">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#e6edf3}
.bg{fill:#0f141b}
.title{font-size:17px;font-weight:700}
.note{font-size:13px;fill:#c9d4df}
.head{font-size:14px;font-weight:700}
.need{fill:#4dabf7;stroke:#0f141b;stroke-width:1}
.handle{fill:#868e96;stroke:#0f141b;stroke-width:1}
.waste{fill:#ff8787;stroke:#0f141b;stroke-width:1}
.bits{font-size:12px;font-weight:700;text-anchor:middle;fill:#0f141b}
.small{font-size:11px;text-anchor:middle;fill:#c9d4df}
.lead{stroke:#7d8896;stroke-width:1}
.brace{fill:none;stroke:#9aa7b5;stroke-width:1.2}
.bl{font-size:12px;fill:#9aa7b5;text-anchor:middle}
.total{font-size:14px;font-weight:700}
</style>
<rect width="900" height="430" class="bg"/>
<text x="20" y="34" class="title">NPC 갱신 한 번에 이동으로 가는 비트</text>
<text x="20" y="56" class="note">칸 하나가 값 하나이고, 폭이 비트 수다. 위치를 축마다 14비트로 쓸 때(이 테스트베드에서 가장 흔한 값)의 예다.</text>

<text x="40" y="80" class="head">지금: 엔진의 ReplicatedMovement와 포스팅 11의 ServerFrame</text>
<path d="M40 110 V104 H704 V110" class="brace"/>
<text x="372" y="99" class="bl">ReplicatedMovement 83</text>
<path d="M706 110 V104 H832 V110" class="brace"/>
<text x="768" y="99" class="bl">ServerFrame 16</text>
<rect x="40" y="112" width="64" height="40" class="handle"/>
<text x="72" y="138" class="bits">핸들 8</text>
<rect x="104" y="112" width="32" height="40" class="waste"/>
<text x="120" y="138" class="bits">4</text>
<path d="M120 154 V166" class="lead"/>
<text x="120" y="180" class="small">플래그 4</text>
<rect x="136" y="112" width="56" height="40" class="waste"/>
<text x="164" y="138" class="bits">헤더 7</text>
<rect x="192" y="112" width="112" height="40" class="need"/>
<text x="248" y="138" class="bits">X 14</text>
<rect x="304" y="112" width="112" height="40" class="need"/>
<text x="360" y="138" class="bits">Y 14</text>
<rect x="416" y="112" width="112" height="40" class="waste"/>
<text x="472" y="138" class="bits">Z 14</text>
<rect x="528" y="112" width="24" height="40" class="waste"/>
<text x="540" y="138" class="bits">3</text>
<path d="M540 154 V166" class="lead"/>
<text x="540" y="180" class="small">회전 있음 3</text>
<rect x="552" y="112" width="64" height="40" class="need"/>
<text x="584" y="138" class="bits">Yaw 8</text>
<rect x="616" y="112" width="80" height="40" class="waste"/>
<text x="656" y="138" class="bits">속도 10</text>
<rect x="696" y="112" width="8" height="40" class="waste"/>
<path d="M700 154 V166" class="lead"/>
<text x="700" y="180" class="small">가속도 있음 1</text>
<rect x="704" y="112" width="64" height="40" class="handle"/>
<text x="736" y="138" class="bits">핸들 8</text>
<rect x="768" y="112" width="64" height="40" class="need"/>
<text x="800" y="138" class="bits">프레임 8</text>
<text x="842" y="138" class="total">99</text>

<text x="40" y="232" class="head">포스팅 12: 평면 이동만 담은 FLabNpcMove</text>
<rect x="40" y="246" width="64" height="40" class="handle"/>
<text x="72" y="272" class="bits">핸들 8</text>
<rect x="104" y="246" width="104" height="40" class="need"/>
<text x="156" y="272" class="bits">X 13</text>
<rect x="208" y="246" width="104" height="40" class="need"/>
<text x="260" y="272" class="bits">Y 13</text>
<rect x="312" y="246" width="64" height="40" class="need"/>
<text x="344" y="272" class="bits">Yaw 8</text>
<rect x="376" y="246" width="64" height="40" class="need"/>
<text x="408" y="272" class="bits">프레임 8</text>
<text x="450" y="272" class="total">50</text>
<text x="490" y="264" class="note">X, Y는 집에서 ±30m 안이라 13비트로 1cm를 담는다.</text>
<text x="490" y="284" class="note">Z, 속도, 헤더, 플래그는 보내지 않는다.</text>

<rect x="40" y="322" width="14" height="14" class="need"/><text x="62" y="334" class="note">NPC에게 필요한 것</text>
<rect x="210" y="322" width="14" height="14" class="handle"/><text x="232" y="334" class="note">프로퍼티 핸들(프로퍼티마다 하나)</text>
<rect x="470" y="322" width="14" height="14" class="waste"/><text x="492" y="334" class="note">필요 없는 것(늘 같은 값, 범위를 알면 필요 없는 헤더)</text>
<text x="20" y="372" class="note">축마다 쓰는 비트 수는 좌표가 클수록 늘어서, 맵 원점에서 멀면 커진다. 이 테스트베드의 평균은 13.8비트, 맵 가장자리는 18비트다.</text>
<text x="20" y="394" class="note">FLabNpcMove는 집을 기준으로 재므로 맵 어디서나 50비트다.</text>
</svg>