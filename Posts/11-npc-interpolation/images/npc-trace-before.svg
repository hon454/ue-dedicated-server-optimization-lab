<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="보간 없음. 서버의 NPC는 곧게 움직이고, 클라이언트 화면의 NPC는 이동 갱신을 받을 때마다 계단처럼 건너뛴다.">
<style>
